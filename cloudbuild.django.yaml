options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # Build Django image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'Dockerfile.django'
      - '-t'
      - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/isyara-repo/isyara-web:$COMMIT_SHA'
      - '-t'
      - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/isyara-repo/isyara-web:latest'
      - '.'

  # Push images
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/isyara-repo/isyara-web:$COMMIT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/isyara-repo/isyara-web:latest']

  # Create/Update migration job (idempotent: replace if exists, create if missing)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  entrypoint: 'bash'
  args:
    - '-lc'
    - |
      set -e
      if gcloud run jobs describe isyara-migrate --region asia-southeast1 >/dev/null 2>&1; then
        gcloud run jobs update isyara-migrate \
          --image asia-southeast1-docker.pkg.dev/$PROJECT_ID/isyara-repo/isyara-web:$COMMIT_SHA \
          --region asia-southeast1 \
          --command bash \
          --args -lc,"python manage.py migrate && python manage.py seed_bisindo" \
          --set-env-vars DJANGO_SETTINGS_MODULE=isyara.settings,DJANGO_DEBUG=0,DJANGO_SECRET_KEY=${_DJANGO_SECRET_KEY},ALLOWED_HOSTS=${_ALLOWED_HOSTS},CSRF_TRUSTED_ORIGINS=${_CSRF_TRUSTED_ORIGINS},CORS_ALLOWED_ORIGINS=${_CORS_ALLOWED_ORIGINS},DATABASE_URL=${_DATABASE_URL},ASSESSMENT_SERVICE_URL=${_ASSESSMENT_SERVICE_URL},SECURE_SSL_REDIRECT=1,SESSION_COOKIE_SECURE=1,CSRF_COOKIE_SECURE=1,SECURE_HSTS_SECONDS=31536000
      else
        gcloud run jobs create isyara-migrate \
          --image asia-southeast1-docker.pkg.dev/$PROJECT_ID/isyara-repo/isyara-web:$COMMIT_SHA \
          --region asia-southeast1 \
          --command bash \
          --args -lc,"python manage.py migrate && python manage.py seed_bisindo" \
          --set-env-vars DJANGO_SETTINGS_MODULE=isyara.settings,DJANGO_DEBUG=0,DJANGO_SECRET_KEY=${_DJANGO_SECRET_KEY},ALLOWED_HOSTS=${_ALLOWED_HOSTS},CSRF_TRUSTED_ORIGINS=${_CSRF_TRUSTED_ORIGINS},CORS_ALLOWED_ORIGINS=${_CORS_ALLOWED_ORIGINS},DATABASE_URL=${_DATABASE_URL},ASSESSMENT_SERVICE_URL=${_ASSESSMENT_SERVICE_URL},SECURE_SSL_REDIRECT=1,SESSION_COOKIE_SECURE=1,CSRF_COOKIE_SECURE=1,SECURE_HSTS_SECONDS=31536000
      fi

  # Execute migrations
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: gcloud
    args:
      - 'run'
      - 'jobs'
      - 'execute'
      - 'isyara-migrate'
      - '--region'
      - 'asia-southeast1'
      - '--wait'

  # Deploy Django web
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'isyara-web'
      - '--image'
      - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/isyara-repo/isyara-web:$COMMIT_SHA'
      - '--region'
      - 'asia-southeast1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--set-env-vars'
      - 'DJANGO_SETTINGS_MODULE=isyara.settings,DJANGO_DEBUG=0,DJANGO_SECRET_KEY=${_DJANGO_SECRET_KEY},ALLOWED_HOSTS=${_ALLOWED_HOSTS},CSRF_TRUSTED_ORIGINS=${_CSRF_TRUSTED_ORIGINS},CORS_ALLOWED_ORIGINS=${_CORS_ALLOWED_ORIGINS},DATABASE_URL=${_DATABASE_URL},ASSESSMENT_SERVICE_URL=${_ASSESSMENT_SERVICE_URL},SECURE_SSL_REDIRECT=1,SESSION_COOKIE_SECURE=1,CSRF_COOKIE_SECURE=1,SECURE_HSTS_SECONDS=31536000,ACCOUNT_EMAIL_VERIFICATION=none'

images:
  - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/isyara-repo/isyara-web:$COMMIT_SHA'
  - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/isyara-repo/isyara-web:latest'
